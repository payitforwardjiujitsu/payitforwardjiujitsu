  <script>
    // ===== ハンバーガー =====
    var ham = document.getElementById('hamburger');
    var menu = document.getElementById('mobileMenu');
    ham.addEventListener('click', function() {
      ham.classList.toggle('open');
      menu.classList.toggle('open');
      document.body.classList.toggle('menu-open');
    });
    menu.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        ham.classList.remove('open');
        menu.classList.remove('open');
        document.body.classList.remove('menu-open');
      });
    });

    // ===== お知らせデータ =====
    const NEWS_DATA = [
    {
      "id": 1,
      "title": "Pay it Forward Jiu-Jitsu オープン決定",
      "date": "2026-05-07",
      "content": "この度、東京・信濃町にて「Pay it Forward Jiu-Jitsu」のオープンが正式に決定いたしました。\n\nはじめての方も、女性も、キッズも、50代以上の方も。それぞれのペースで楽しく強くなれる場所を目指します。\n\nオープン日・体験会の詳細については順次お知らせいたします。\nぜひInstagramやLINEでの最新情報をお見逃しなく。"
    },
    {
      "id": 2,
      "title": "オープン準備スタート",
      "date": "2026-05-17",
      "content": "本日よりオープンに向けた準備を本格的にスタートしました。\n\n道場の整備、スケジュール調整、体験会の企画など、鋭意準備中です。\n\n無料体験のお申し込みは「お問い合わせ」ページよりお気軽にどうぞ。\nオープンまで今しばらくお待ちください。"
    },
    {
      "id": 3,
      "title": "ジムの近くの歩道橋からの眺め",
      "date": "2026-05-19",
      "thumbnail": "news01.jpg",
      "content": "ジムの近くの有名な歩道橋です！\n\nジムの準備の最中にお散歩。\n\n良いジムを作って皆さんをお待ちしております。"
    },
    {
      "id": 4,
      "title": "プレオープン＆グランドオープンのお知らせ",
      "date": "2026-06-22",
      "thumbnail": "news02.jpg",
      "content": "7月28日（火）〜31日（金） プレオープン\n8月1日（土） グランドオープン\n\nいよいよ、Pay it Forward JIU-JITSUがオープンします！\n\n7月28日（火）から31日（金）までの4日間は「プレオープン期間」として、体験レッスンや見学を随時受け付けております。\n\nそして8月1日（土）はいよいよグランドオープン！当日はお披露目会として、体験レッスン・施設見学・インストラクターとの交流など、楽しいイベントを予定しています。\n\n「ちょっと気になっていた」「柔術をやってみたかった」という方、ぜひこの機会に遊びにいらしてください！\n\n皆さんとマットの上でお会いできることを楽しみにしております。\n\n— New Challenge, Stronger Together. —"
    },
    {
      "id": 5,
      "title": "クラススケジュール変更のお知らせ",
      "date": "2026-08-27",
      "content": "いつもPay it Forward JIU-JITSUをご利用いただき、ありがとうございます。\n\nこのたび、より多くの皆さまに柔術を楽しんでいただける環境づくりと、初心者の方にもより分かりやすく参加しやすいクラス構成を目指し、クラススケジュールを変更いたします。\n\nBEGINNER\n柔術未経験者・初心者の方が安心して参加できる45分間のクラスです。\n基本的な動きやポジション、エスケープ、ガード、パス、スイープ、サブミッションなど、ブラジリアン柔術に必要な基礎を段階的に学んでいきます。\n初めて柔術をされる方は、まずはこちらのクラスへの参加をおすすめします。\n経験者の方も、基礎技術の確認や反復練習としてご参加いただけます。\n\nALL LEVELS\n白帯から黒帯まで、すべてのレベルの方が参加できる60分間の柔術クラスです。\nテクニック練習だけでなく、シチュエーションスパーリングや通常のスパーリングなども取り入れ、より実践的に柔術を学んでいきます。\n\nNO-GI / GRAPPLING\n道着を着用せず、ラッシュガードやショーツで行う60分間のグラップリングクラスです。\n柔術の技術をベースに、NO-GIならではの動きやテクニックについても学んでいきます。\n\n初心者の方が、より始めやすい道場へ\n今回のスケジュール変更では、BEGINNERクラスを月曜日から日曜日まで毎日開催します。\n\n「柔術に興味はあるけれど、格闘技経験がない」\n「運動経験が少なくて不安」\n「仕事の都合で決まった曜日には通えない」\n\nそんな方にも、ご自身の生活スタイルに合わせて柔術を始めていただける環境を目指しました。\n\nまた、経験を積んだ後はALL LEVELS、NO-GI / GRAPPLING、SPARRINGなど、それぞれの目的や楽しみ方に合わせて参加するクラスを選んでいただけます。\n\nこれからも、初めてマットに上がる方から経験者の方まで、皆さまが長く柔術を楽しみ、成長していける道場づくりに努めてまいります。\n\n今後ともPay it Forward JIU-JITSUをよろしくお願いいたします。",
      "links": [
        {
          "href": "schedule.html",
          "label": "クラススケジュールを見る"
        }
      ]
    }
  ];

    // ===== 詳細表示 =====
    function formatDate(s) {
      var d = new Date(s);
      return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
    }

    var params = new URLSearchParams(window.location.search);
    var targetId = parseInt(params.get('id'));
    var item = null;
    for (var i = 0; i < NEWS_DATA.length; i++) {
      if (NEWS_DATA[i].id === targetId) { item = NEWS_DATA[i]; break; }
    }

    var container = document.getElementById('detailContainer');
    if (!item) {
      container.innerHTML = '<p class="detail-loading">記事が見つかりませんでした。</p>';
    } else {
      document.title = item.title + ' | Pay it Forward Jiu-Jitsu';
      var canon = document.createElement('link');
      canon.rel = 'canonical';
      canon.href = 'https://payitforwardjiujitsu.com/news-detail.html?id=' + item.id;
      document.head.appendChild(canon);
      var body = item.content.replace(/\n/g, '<br>');
      var linkHtml = '';
      if (item.links && item.links.length) {
        var parts = [];
        for (var j = 0; j < item.links.length; j++) {
          parts.push('<a href="' + item.links[j].href + '" class="btn-primary">' + item.links[j].label +
            '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>');
        }
        linkHtml = '<div class="detail-cta">' + parts.join('') + '</div>';
      }
      var imgHtml = item.thumbnail ? '<img src="' + item.thumbnail + '" alt="' + item.title + '" class="detail-img" loading="lazy">' : '';
      container.innerHTML =
        '<p class="detail-eyebrow">お知らせ</p>' +
        '<p class="detail-date">' + formatDate(item.date) + '</p>' +
        '<h1 class="detail-title">' + item.title + '</h1>' +
        imgHtml +
        '<div class="detail-body">' + body + '</div>' +
        linkHtml +
        '<a href="news.html" class="detail-back">' +
        '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 7H3M6 3L2 7l4 4" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        'お知らせ一覧へ戻る</a>';
    }
  </script>
